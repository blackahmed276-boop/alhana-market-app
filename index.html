<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الهنا ماركت - تحميل التطبيق</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: linear-gradient(160deg, #eef7ff, #ffffff);
      color: #082b55;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 28px;
      padding: 35px 24px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 70, 150, 0.15);
    }

    .icon {
      width: 95px;
      height: 95px;
      margin: auto;
      border-radius: 25px;
      background: linear-gradient(135deg, #0066d6, #003b83);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    h1 {
      font-size: 34px;
      margin: 20px 0 5px;
      color: #063c7c;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 20px;
      font-weight: normal;
      color: #52708f;
    }

    .delivery {
      background: #eef6ff;
      border-radius: 18px;
      padding: 15px;
      margin: 20px 0;
      font-size: 19px;
      font-weight: bold;
    }

    .download {
      display: block;
      text-decoration: none;
      background: linear-gradient(135deg, #0878e8, #034fa5);
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 18px;
      border-radius: 16px;
      margin-top: 25px;
      box-shadow: 0 8px 20px rgba(0, 90, 190, 0.25);
    }

    .download:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 18px;
      color: #687b8f;
      font-size: 14px;
      line-height: 1.7;
    }

    .features {
      margin-top: 25px;
      display: flex;
      justify-content: space-around;
      gap: 8px;
      font-size: 13px;
    }

    .feature {
      flex: 1;
      background: #f4f9ff;
      padding: 12px 5px;
      border-radius: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">🛒</div>

    <h1>الهنا ماركت</h1>
    <h2>تطبيق التوصيل</h2>

    <div class="delivery">
      ⚡ خدمة التوصيل 24 ساعة
    </div>

    <p>
      كل احتياجاتك لحد باب بيتك<br>
      حمّل تطبيق الهنا ماركت وابدأ التسوق الآن
    </p>

    <a class="download"
       href="https://drive.google.com/uc?export=download&id=1D79-88RfiFeSiEzkYGddCKJ_leQZsh2Z">
      ⬇ تحميل التطبيق للأندرويد
    </a>

    <div class="features">
      <div class="feature">🛍️<br>منتجات متنوعة</div>
      <div class="feature">🚚<br>توصيل سريع</div>
      <div class="feature">🏠<br>لحد باب بيتك</div>
    </div>

    <div class="note">
      أحدث إصدار من تطبيق الهنا ماركت<br>
      عند صدور نسخة جديدة سيتم تحديث زر التحميل هنا.
    </div>

  </div>

</body>
</html>
